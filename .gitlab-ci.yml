stages: [test, build]
test:
  stage: test
  image: node:24-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: agentwall_test
    POSTGRES_USER: agentwall
    POSTGRES_PASSWORD: ci-disposable-password
    TEST_DATABASE_URL: postgres://agentwall:ci-disposable-password@postgres:5432/agentwall_test
  script:
    - npm ci
    - npm run check
    - npm test
build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/app:latest" .
    - docker push "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/app:latest"
