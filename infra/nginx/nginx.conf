worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format observation escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout observation;
  error_log /dev/stderr crit;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 16k;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  server {
    listen 80;
    listen 8080;
    location /admin/ { return 404; }
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_hide_header X-Powered-By;
    }
  }
}
