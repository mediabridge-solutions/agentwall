image:
  repository: registry.gitlab.com/media_bridge/agent-wall/app
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: agentwall-registry
replicas: 1
existingSecret: agentwall-secrets
publicUrl: https://agentwall.net
contactEmail: office@mediabridge.solutions
indexingEnabled: false
ingress:
  enabled: true
  className: public
  host: agentwall.net
  tls: true
  clusterIssuer: letsencrypt-prod
postgres:
  image: postgres:17-alpine
  storage: 10Gi
  storageClass: microk8s-hostpath
backup:
  enabled: true
  storage: 10Gi
  schedule: "17 2 * * *"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
