apiVersion: v1
kind: ConfigMap
metadata:
  name: agentwall-config
data:
  PUBLIC_URL: {{ .Values.publicUrl | quote }}
  CONTACT_EMAIL: {{ .Values.contactEmail | quote }}
  INDEXING_ENABLED: {{ .Values.indexingEnabled | quote }}
  TRUST_PROXY: "127.0.0.1"
  LOG_LEVEL: info
  NODE_ENV: production
  APP_VERSION: {{ .Values.image.tag | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentwall
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: agentwall }
  template:
    metadata:
      labels: { app: agentwall }
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-for-database
          image: {{ .Values.postgres.image }}
          command: [sh, -ec, "until pg_isready -h agentwall-postgres -U agentwall -d agentwall; do sleep 2; done"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000, name: app }]
          envFrom:
            - configMapRef: { name: agentwall-config }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /health/ready, port: app }, periodSeconds: 3, failureThreshold: 40 }
          readinessProbe: { httpGet: { path: /health/ready, port: app }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: app }, periodSeconds: 15, timeoutSeconds: 3 }
        - name: nginx
          image: nginx:1.28-alpine
          command: [nginx, "-g", "daemon off;"]
          ports: [{ containerPort: 8080, name: http }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          volumeMounts:
            - { name: nginx, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
      volumes:
        - name: nginx
          configMap: { name: agentwall-nginx }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agentwall
spec:
  selector: { app: agentwall }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentwall-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      server_tokens off;
      log_format observation escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
      access_log /dev/stdout observation;
      error_log /dev/stderr crit;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      client_max_body_size 16k;
      client_body_timeout 15s;
      gzip on;
      gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
      # The namespace policy permits ingress only from the cluster ingress controller.
      # Trust the controller's last X-Forwarded-For hop, never arbitrary leftmost values.
      set_real_ip_from 10.0.0.0/8;
      set_real_ip_from 127.0.0.1;
      real_ip_header X-Forwarded-For;
      real_ip_recursive off;
      # Published Cloudflare ranges, verified 2026-09-05. Only these edge peers
      # may supply CF-Connecting-IP after ingress has overwritten X-Forwarded-For.
      geo $remote_addr $cloudflare_peer {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
      }
      map "$cloudflare_peer:$http_cf_connecting_ip" $observed_client_ip {
        default $remote_addr;
        ~^1:([0-9a-fA-F:.]+)$ $http_cf_connecting_ip;
      }
      server {
        listen 8080;
        location /admin/ { return 404; }
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $observed_client_ip;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
          proxy_connect_timeout 5s;
          proxy_read_timeout 20s;
        }
      }
    }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentwall
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: agentwall-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: agentwall, port: { name: http } }
{{- end }}
