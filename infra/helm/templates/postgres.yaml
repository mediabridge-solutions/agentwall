apiVersion: v1
kind: Service
metadata:
  name: agentwall-postgres
spec:
  clusterIP: None
  selector: { app: agentwall-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentwall-postgres
spec:
  serviceName: agentwall-postgres
  replicas: 1
  selector:
    matchLabels: { app: agentwall-postgres }
  template:
    metadata:
      labels: { app: agentwall-postgres }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: agentwall }
            - { name: POSTGRES_USER, value: agentwall }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { exec: { command: [pg_isready, -U, agentwall, -d, agentwall] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, agentwall, -d, agentwall] }, initialDelaySeconds: 30, periodSeconds: 15 }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
