apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentwall-postgres
spec:
  podSelector:
    matchLabels: { app: agentwall-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: agentwall }
        - podSelector:
            matchLabels: { app: agentwall-maintenance }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentwall-web
spec:
  podSelector:
    matchLabels: { app: agentwall }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports: [{ protocol: TCP, port: 8080 }]
